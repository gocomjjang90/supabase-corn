name: Keep Audit Supabase Alive

on:
  schedule:
    # 3일에 한 번씩 실행 (한국 시간 기준 새벽이나 원하는 시간)
    - cron: '0 0 */3 * *' 
  workflow_dispatch: # GitHub 웹에서 수동으로 테스트 실행 가능 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Audit Supabase Database
        run: |
          curl -X GET "${{ secrets.AUDIT_SUPABASE_URL }}/rest/v1/audit_reports?select=id&limit=1" \
          -H "apikey: ${{ secrets.AUDIT_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.AUDIT_SUPABASE_ANON_KEY }}"
