name: Keep All Supabase Projects Alive

on:
  schedule:
    # 3일에 한 번씩 자동 실행 (Supabase 7일 미활동 잠금 방지)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub 웹에서 수동 실행 버튼 활성화

jobs:
  ping-all-projects:
    runs-on: ubuntu-latest
    steps:
      # 1. risk-card 프로젝트 Ping
      - name: Ping risk-card Project
        run: |
          curl -i -X GET "${{ secrets.RISK_CARD_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.RISK_CARD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.RISK_CARD_ANON_KEY }}"

      # 2. S&H system 프로젝트 Ping
      - name: Ping S&H system Project
        run: |
          curl -i -X GET "${{ secrets.SH_SYSTEM_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SH_SYSTEM_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SH_SYSTEM_ANON_KEY }}"
