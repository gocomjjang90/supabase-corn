
name: Keep All Supabase Projects Alive

on:
  schedule:
    # 6시간마다 자동 실행 (UTC 기준)
    - cron: '0 */6 * * *'

  # GitHub에서 수동 실행 가능
  workflow_dispatch:

jobs:
  ping-all-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. risk-card 프로젝트 Ping
      - name: Ping risk-card Project
        env:
          SUPABASE_URL: ${{ secrets.RISK_CARD_URL }}
          SUPABASE_KEY: ${{ secrets.RISK_CARD_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "${SUPABASE_URL}/rest/v1/cards?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"

      # 2. S&H system 프로젝트 Ping
      - name: Ping S&H system Project
        if: ${{ always() }}
        env:
          SUPABASE_URL: ${{ secrets.SH_SYSTEM_URL }}
          SUPABASE_KEY: ${{ secrets.SH_SYSTEM_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"

